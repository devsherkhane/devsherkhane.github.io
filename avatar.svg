<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Dynamic Ggradient matching the theme accent colors -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #1a666b)" />
      <stop offset="100%" stop-color="var(--color-secondary, #5faab0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background with subtle theme variables -->
  <circle cx="200" cy="200" r="180" fill="var(--color-surface-2, #f6f1e8)" stroke="var(--color-border, rgba(0,0,0,0.08))" stroke-width="2" />
  
  <!-- Subtle back glow -->
  <circle cx="200" cy="200" r="130" fill="url(#avatarGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Abstract Tech / AI nodes and mesh lines -->
  <g stroke="var(--color-primary, #1a666b)" stroke-width="1" opacity="0.25">
    <line x1="120" y1="130" x2="200" y2="90" />
    <line x1="200" y1="90" x2="280" y2="130" />
    <line x1="120" y1="130" x2="120" y2="230" />
    <line x1="280" y1="130" x2="280" y2="230" />
    <line x1="120" y1="230" x2="200" y2="280" />
    <line x1="280" y1="230" x2="200" y2="280" />
    
    <line x1="200" y1="90" x2="200" y2="280" />
    <line x1="120" y1="130" x2="280" y2="230" />
    <line x1="120" y1="230" x2="280" y2="130" />
  </g>

  <!-- Tech Nodes -->
  <circle cx="200" cy="90" r="5" fill="var(--color-secondary, #5faab0)" />
  <circle cx="120" cy="130" r="4" fill="var(--color-primary, #1a666b)" />
  <circle cx="280" cy="130" r="4" fill="var(--color-primary, #1a666b)" />
  <circle cx="120" cy="230" r="4" fill="var(--color-primary, #1a666b)" />
  <circle cx="280" cy="230" r="4" fill="var(--color-primary, #1a666b)" />
  <circle cx="200" cy="280" r="5" fill="var(--color-secondary, #5faab0)" />

  <!-- Code Symbol (Brackets) floating elegantly -->
  <path d="M 155 170 L 140 185 L 155 200" fill="none" stroke="url(#avatarGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 245 170 L 260 185 L 245 200" fill="none" stroke="url(#avatarGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="210" y1="165" x2="190" y2="205" stroke="var(--color-text-muted, #5b6462)" stroke-width="4" stroke-linecap="round" />

  <!-- Glowing core representation of AI / Neural Center -->
  <circle cx="200" cy="185" r="16" fill="url(#avatarGrad)" opacity="0.85" filter="url(#glow)" />
  <circle cx="200" cy="185" r="7" fill="var(--color-bg, #ece8df)" />

  <!-- Monogram text DS representing Dev Sherkhane -->
  <text x="200" y="335" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="32" font-weight="800" letter-spacing="-1.5" fill="var(--color-text, #1c2221)" text-anchor="middle">
    DEV
  </text>
  <text x="200" y="358" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="var(--color-primary, #1a666b)" text-anchor="middle" opacity="0.8">
    SHERKHANE
  </text>
</svg>
